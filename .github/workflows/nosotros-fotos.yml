name: nosotros-fotos
on:
  push:
    branches: [main]
    paths: ["pedidos/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nosotros-fotos
  cancel-in-progress: false
jobs:
  bajar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow requests
      - run: python tools/bajar_fotos.py
      - name: Subir resultado
        run: |
          git config user.name "nosotros-fotos-bot"
          git config user.email "nosotros-fotos-bot@users.noreply.github.com"
          git add -A fotos pedidos
          git diff --cached --quiet && exit 0
          git commit -m "fotos: $(date -u +%Y%m%dT%H%M%SZ)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
